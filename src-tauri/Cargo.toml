[package]
name = "bark"
version = "0.1.0"
description = "Desktop companion & control hub for Google Antigravity & Hermes Agent"
authors = ["Aristide"]
edition = "2021"

[lib]
name = "bark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
chrono = "0.4"
dirs = "6.0"
